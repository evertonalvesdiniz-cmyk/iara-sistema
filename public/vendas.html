<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Vendas</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', Arial, sans-serif; padding: 30px; background: rgba(255, 255, 255, 0.95); min-height: 100vh; }
h2 { color: #2c3e50; margin-bottom: 25px; font-size: 24px; }
h3 { color: #4a5568; margin: 20px 0 15px; font-size: 18px; }
.formulario { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
.campo { margin-bottom: 15px; }
.campo label { display: block; margin-bottom: 5px; color: #4a5568; font-size: 14px; font-weight: 500; }
.campo input, .campo select { width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; transition: border 0.3s; }
.campo input:focus, .campo select:focus { outline: none; border-color: #ccbfb5; }
.linha-dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.produto-card { background: #f7fafc; padding: 20px; border-radius: 8px; border-left: 4px solid #ccbfb5; margin-bottom: 15px; }
.produto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.produto-numero { font-weight: 600; color: #2c3e50; }
.btn-remover-produto { background-color: #e53e3e; color: white; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
.totais-venda { background: #edf2f7; padding: 20px; border-radius: 8px; margin: 20px 0; }
.totais-venda .linha-dupla { gap: 20px; }
.total-item { text-align: center; }
.total-label { font-size: 13px; color: #718096; margin-bottom: 5px; }
.total-valor { font-size: 24px; font-weight: 700; color: #2c3e50; }
button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
.btn-primario { background-color: #2c3e50; color: white; }
.btn-primario:hover { background-color: #1a252f; transform: translateY(-2px); }
.btn-secundario { background-color: #ccbfb5; color: #2c3e50; }
.btn-secundario:hover { background-color: #b8ada3; }
.btn-sucesso { background-color: #48bb78; color: white; }
.btn-sucesso:hover { background-color: #38a169; }
.barra-busca { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
.barra-busca input { flex: 1; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; }
.lista-vendas { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
.venda-item { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
.venda-item:hover { background: #f7fafc; }
.venda-info h4 { color: #2c3e50; margin-bottom: 8px; }
.venda-info p { font-size: 13px; color: #718096; margin: 3px 0; }
.venda-acoes { display: flex; gap: 8px; }
.btn-pequeno { padding: 6px 12px; font-size: 13px; }
.btn-perigo { background-color: #e53e3e; color: white; }
.btn-perigo:hover { background-color: #c53030; }
.mensagem-vazia { padding: 40px 20px; text-align: center; color: #718096; }
#formEdicao { display: none; }
#formEdicao.ativo { display: block; }
.campo-obrigatorio::after { content: " *"; color: #e53e3e; }
</style>
</head>
<body>

<h2>Gestão de Vendas</h2>

<div class="formulario" id="formularioCadastro">
    <h3>Cadastrar Nova Venda</h3>
    <form id="formVenda">
        <div class="campo">
            <label class="campo-obrigatorio">Cliente</label>
            <select id="clienteSelect" required>
                <option value="">Selecione um cliente</option>
            </select>
        </div>
        
        <h3>Produtos/Serviços</h3>
        <div id="containerProdutos"></div>
        
        <button type="button" class="btn-sucesso" id="btnAddProduto">+ Adicionar Produto</button>
        
        <div class="totais-venda">
            <div class="linha-dupla">
                <div class="total-item">
                    <div class="total-label">Valor Total Cliente</div>
                    <div class="total-valor" id="totalValorCliente">R$ 0,00</div>
                    <div style="font-size: 11px; color: #718096; margin-top: 5px;">Tarifa + Taxa</div>
                </div>
                <div class="total-item">
                    <div class="total-label" style="color: #48bb78;">SEU LUCRO</div>
                    <div class="total-valor" id="totalLucro" style="color: #48bb78;">R$ 0,00</div>
                    <div style="font-size: 11px; color: #718096; margin-top: 5px;">Taxa (Comissão + Over)</div>
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn-primario">Cadastrar Venda</button>
    </form>
</div>

<div class="formulario" id="formEdicao">
    <h3>Editar Venda</h3>
    <form id="formEditarVenda">
        <input type="hidden" id="editIndice">
        
        <div class="campo">
            <label class="campo-obrigatorio">Cliente</label>
            <select id="editClienteSelect" required>
                <option value="">Selecione um cliente</option>
            </select>
        </div>
        
        <h3>Produtos/Serviços</h3>
        <div id="editContainerProdutos"></div>
        
        <button type="button" class="btn-sucesso" id="btnEditAddProduto">+ Adicionar Produto</button>
        
        <div class="totais-venda">
            <div class="linha-dupla">
                <div class="total-item">
                    <div class="total-label">Valor Total Cliente</div>
                    <div class="total-valor" id="editTotalValorCliente">R$ 0,00</div>
                    <div style="font-size: 11px; color: #718096; margin-top: 5px;">Tarifa + Taxa</div>
                </div>
                <div class="total-item">
                    <div class="total-label" style="color: #48bb78;">SEU LUCRO</div>
                    <div class="total-valor" id="editTotalLucro" style="color: #48bb78;">R$ 0,00</div>
                    <div style="font-size: 11px; color: #718096; margin-top: 5px;">Taxa (Comissão + Over)</div>
                </div>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn-primario" style="flex: 1;">Salvar Alterações</button>
            <button type="button" class="btn-secundario" id="btnCancelarEdicao" style="flex: 1;">Cancelar</button>
        </div>
    </form>
</div>

<div class="barra-busca">
    <input type="text" id="inputBusca" placeholder="Buscar venda por cliente...">
    <button class="btn-primario" id="btnBuscar">Buscar</button>
    <button class="btn-secundario" id="btnTodas">Ver Todas</button>
</div>

<div class="lista-vendas" id="listaVendas">
    <div class="mensagem-vazia">Nenhuma venda cadastrada</div>
</div>

<script src="utils.js"></script>
<script src="db-clientes.js"></script>
<script src="db-fornecedores.js"></script>
<script src="db-vendas.js"></script>
<script>
let produtosLista = [];
let produtosEditLista = [];

const elementos = {
    formVenda: document.getElementById('formVenda'),
    formEditarVenda: document.getElementById('formEditarVenda'),
    formEdicao: document.getElementById('formEdicao'),
    formularioCadastro: document.getElementById('formularioCadastro'),
    containerProdutos: document.getElementById('containerProdutos'),
    editContainerProdutos: document.getElementById('editContainerProdutos'),
    listaVendas: document.getElementById('listaVendas')
};

// Carrega clientes no select
function carregarClientes() {
    const clientes = DB_CLIENTES.listarTodos();
    const selectCadastro = document.getElementById('clienteSelect');
    const selectEdicao = document.getElementById('editClienteSelect');
    
    selectCadastro.innerHTML = '<option value="">Selecione um cliente</option>';
    selectEdicao.innerHTML = '<option value="">Selecione um cliente</option>';
    
    clientes.forEach((cliente, index) => {
        const option1 = document.createElement('option');
        option1.value = index;
        option1.textContent = cliente.nome;
        selectCadastro.appendChild(option1);
        
        const option2 = document.createElement('option');
        option2.value = index;
        option2.textContent = cliente.nome;
        selectEdicao.appendChild(option2);
    });
}

carregarClientes();

function adicionarProduto(container, lista, dados = {}) {
    const indice = lista.length;
    const card = document.createElement('div');
    card.className = 'produto-card';
    card.dataset.indice = indice;
    
    // Carrega fornecedores
    const fornecedores = DB_FORNECEDORES.listarTodos();
    let optionsFornecedor = '<option value="">Selecione um fornecedor</option>';
    fornecedores.forEach(f => {
        const selected = dados.fornecedor === f.nome ? 'selected' : '';
        optionsFornecedor += `<option value="${f.nome}" ${selected}>${f.nome}</option>`;
    });
    
    card.innerHTML = `
        <div class="produto-header">
            <span class="produto-numero">Produto ${indice + 1}</span>
            <button type="button" class="btn-remover-produto">Remover</button>
        </div>
        <div class="campo">
            <label class="campo-obrigatorio">Produto/Serviço</label>
            <input type="text" class="p-produto" required value="${dados.produto || ''}">
        </div>
        <div class="campo">
            <label>Destino</label>
            <select class="p-destino">
                <option value="Nacional" ${dados.destino === 'Nacional' ? 'selected' : ''}>Nacional</option>
                <option value="Internacional" ${dados.destino === 'Internacional' ? 'selected' : ''}>Internacional</option>
            </select>
        </div>
        <div class="linha-dupla">
            <div class="campo">
                <label>Data Embarque</label>
                <input type="text" class="p-dataEmbarque" placeholder="DD/MM/AAAA" value="${dados.dataEmbarque || ''}">
            </div>
            <div class="campo">
                <label>Data Retorno</label>
                <input type="text" class="p-dataRetorno" placeholder="DD/MM/AAAA" value="${dados.dataRetorno || ''}">
            </div>
        </div>
        <div class="linha-dupla">
            <div class="campo">
                <label class="campo-obrigatorio">Tarifa (Custo Fornecedor)</label>
                <input type="text" class="p-valor" required value="${dados.valor ? formatarMoedaBR(dados.valor) : ''}">
            </div>
            <div class="campo">
                <label>Comissão (Seu Lucro)</label>
                <input type="text" class="p-comissao" value="${dados.comissao ? formatarMoedaBR(dados.comissao) : ''}">
            </div>
        </div>
        <div class="linha-dupla">
            <div class="campo">
                <label>Taxa (Para Cliente) - Calculada</label>
                <input type="text" class="p-taxa" readonly value="${dados.taxa ? formatarMoedaBR(dados.taxa) : 'R$ 0,00'}" style="background: #f7fafc;">
            </div>
            <div class="campo">
                <label>Over (Seu Lucro Adicional)</label>
                <input type="text" class="p-over" value="${dados.over ? formatarMoedaBR(dados.over) : ''}">
            </div>
        </div>
        <div class="campo">
            <label>Intermediário</label>
            <input type="text" class="p-intermediario" value="${dados.intermediario || ''}">
        </div>
        <div class="linha-dupla">
            <div class="campo">
                <label class="campo-obrigatorio">Fornecedor</label>
                <select class="p-fornecedor" required>
                    ${optionsFornecedor}
                </select>
            </div>
            <div class="campo">
                <label>Localizador/ID</label>
                <input type="text" class="p-localizador" value="${dados.localizador || ''}">
            </div>
        </div>
    `;
    
    container.appendChild(card);
    
    const dataEmbarque = card.querySelector('.p-dataEmbarque');
    const dataRetorno = card.querySelector('.p-dataRetorno');
    aplicarMascaraData(dataEmbarque);
    aplicarMascaraData(dataRetorno);
    
    const inputsValor = ['.p-valor', '.p-comissao', '.p-taxa', '.p-over'];
    inputsValor.forEach(selector => {
        const input = card.querySelector(selector);
        aplicarMascaraMoeda(input);
        input.addEventListener('input', () => calcularReceita(card, container === elementos.editContainerProdutos));
    });
    
    card.querySelector('.btn-remover-produto').addEventListener('click', () => {
        card.remove();
        lista.splice(indice, 1);
        renumerarProdutos(container);
        calcularTotais(container === elementos.editContainerProdutos);
    });
    
    lista.push(card);
    calcularReceita(card, container === elementos.editContainerProdutos);
}

function renumerarProdutos(container) {
    const cards = container.querySelectorAll('.produto-card');
    cards.forEach((card, i) => {
        card.querySelector('.produto-numero').textContent = `Produto ${i + 1}`;
        card.dataset.indice = i;
    });
}

function calcularReceita(card, isEdit) {
    const comissao = parseMoedaToCentavos(card.querySelector('.p-comissao').value);
    const over = parseMoedaToCentavos(card.querySelector('.p-over').value);
    const taxa = comissao + over;
    card.querySelector('.p-taxa').value = formatarMoedaBR(taxa);
    calcularTotais(isEdit);
}

function calcularTotais(isEdit) {
    const container = isEdit ? elementos.editContainerProdutos : elementos.containerProdutos;
    const cards = container.querySelectorAll('.produto-card');
    let totalValorCliente = 0;
    let totalLucro = 0;
    cards.forEach(card => {
        const tarifa = parseMoedaToCentavos(card.querySelector('.p-valor').value);
        const taxa = parseMoedaToCentavos(card.querySelector('.p-taxa').value);
        totalValorCliente += tarifa + taxa;
        totalLucro += taxa;
    });
    if (isEdit) {
        document.getElementById('editTotalValorCliente').textContent = formatarMoedaBR(totalValorCliente);
        document.getElementById('editTotalLucro').textContent = formatarMoedaBR(totalLucro);
    } else {
        document.getElementById('totalValorCliente').textContent = formatarMoedaBR(totalValorCliente);
        document.getElementById('totalLucro').textContent = formatarMoedaBR(totalLucro);
    }
}

document.getElementById('btnAddProduto').addEventListener('click', () => {
    adicionarProduto(elementos.containerProdutos, produtosLista);
});

document.getElementById('btnEditAddProduto').addEventListener('click', () => {
    adicionarProduto(elementos.editContainerProdutos, produtosEditLista);
});

elementos.formVenda.addEventListener('submit', (e) => {
    e.preventDefault();
    const clienteIndex = document.getElementById('clienteSelect').value;
    
    if (!clienteIndex) {
        mostrarNotificacao('Selecione um cliente', 'error');
        return;
    }
    
    if (produtosLista.length === 0) {
        mostrarNotificacao('Adicione pelo menos um produto', 'warning');
        return;
    }
    
    const produtos = Array.from(elementos.containerProdutos.querySelectorAll('.produto-card')).map(card => ({
        produto: card.querySelector('.p-produto').value,
        destino: card.querySelector('.p-destino').value,
        dataEmbarque: card.querySelector('.p-dataEmbarque').value,
        dataRetorno: card.querySelector('.p-dataRetorno').value,
        valor: card.querySelector('.p-valor').value,
        comissao: card.querySelector('.p-comissao').value,
        taxa: card.querySelector('.p-taxa').value,
        over: card.querySelector('.p-over').value,
        intermediario: card.querySelector('.p-intermediario').value,
        fornecedor: card.querySelector('.p-fornecedor').value,
        localizador: card.querySelector('.p-localizador').value
    }));
    
    // Validação de fornecedor
    const semFornecedor = produtos.filter(p => !p.fornecedor);
    if (semFornecedor.length > 0) {
        mostrarNotificacao('Todos os produtos devem ter um fornecedor selecionado', 'error');
        return;
    }
    
    for (const p of produtos) {
        if (p.dataEmbarque && p.dataRetorno) {
            if (!dataFimMaiorQueInicio(p.dataEmbarque, p.dataRetorno)) {
                mostrarNotificacao('Data de retorno não pode ser menor que data de embarque', 'error');
                return;
            }
        }
    }
    
    const venda = {
        clienteIndex: parseInt(clienteIndex),
        produtos: produtos
    };
    
    const resultado = DB_VENDAS.adicionar(venda);
    
    if (resultado.sucesso) {
        mostrarNotificacao(resultado.mensagem, 'success');
        elementos.formVenda.reset();
        elementos.containerProdutos.innerHTML = '';
        produtosLista = [];
        document.getElementById('totalValorCliente').textContent = 'R$ 0,00';
        document.getElementById('totalLucro').textContent = 'R$ 0,00';
        carregarTodasVendas();
    } else {
        mostrarNotificacao(resultado.mensagem, 'error');
    }
});

function renderizarVendas(vendas) {
    elementos.listaVendas.innerHTML = '';
    if (!vendas || vendas.length === 0) {
        elementos.listaVendas.innerHTML = '<div class="mensagem-vazia">Nenhuma venda encontrada</div>';
        return;
    }
    vendas.forEach(venda => {
        const item = document.createElement('div');
        item.className = 'venda-item';
        item.innerHTML = `
            <div class="venda-info">
                <h4>Venda #${venda.numero} - ${venda.clienteNome}</h4>
                <p>Data: ${venda.dataCadastro} | Produtos: ${venda.produtos.length}</p>
                <p>Valor Cliente: ${formatarMoedaBR(venda.totalValorCliente)} | <strong style="color: #48bb78;">Seu Lucro: ${formatarMoedaBR(venda.totalLucro)}</strong></p>
            </div>
            <div class="venda-acoes">
                <button class="btn-secundario btn-pequeno" onclick="editarVenda(${venda.indice})">Editar</button>
                <button class="btn-perigo btn-pequeno" onclick="excluirVenda(${venda.indice})">Excluir</button>
            </div>
        `;
        elementos.listaVendas.appendChild(item);
    });
}

function carregarTodasVendas() {
    const vendas = DB_VENDAS.listarTodas().map((v, i) => ({ ...v, indice: i }));
    renderizarVendas(vendas);
}

document.getElementById('btnTodas').addEventListener('click', carregarTodasVendas);

document.getElementById('btnBuscar').addEventListener('click', () => {
    const termo = document.getElementById('inputBusca').value.trim().toLowerCase();
    if (!termo) {
        mostrarNotificacao('Digite o nome do cliente', 'warning');
        return;
    }
    const todasVendas = DB_VENDAS.listarTodas().map((v, i) => ({ ...v, indice: i }));
    const filtradas = todasVendas.filter(v => v.clienteNome.toLowerCase().includes(termo));
    renderizarVendas(filtradas);
});

function editarVenda(indice) {
    const venda = DB_VENDAS.buscarPorIndice(indice);
    if (!venda) {
        mostrarNotificacao('Venda não encontrada', 'error');
        return;
    }
    document.getElementById('editIndice').value = indice;
    document.getElementById('editClienteSelect').value = venda.clienteIndex;
    elementos.editContainerProdutos.innerHTML = '';
    produtosEditLista = [];
    venda.produtos.forEach(produto => {
        adicionarProduto(elementos.editContainerProdutos, produtosEditLista, produto);
    });
    elementos.formEdicao.classList.add('ativo');
    elementos.formularioCadastro.style.display = 'none';
    elementos.formEdicao.scrollIntoView({ behavior: 'smooth' });
}

elementos.formEditarVenda.addEventListener('submit', (e) => {
    e.preventDefault();
    const indice = parseInt(document.getElementById('editIndice').value);
    const clienteIndex = document.getElementById('editClienteSelect').value;
    
    if (!clienteIndex) {
        mostrarNotificacao('Selecione um cliente', 'error');
        return;
    }
    
    if (produtosEditLista.length === 0) {
        mostrarNotificacao('Adicione pelo menos um produto', 'warning');
        return;
    }
    
    const produtos = Array.from(elementos.editContainerProdutos.querySelectorAll('.produto-card')).map(card => ({
        produto: card.querySelector('.p-produto').value,
        destino: card.querySelector('.p-destino').value,
        dataEmbarque: card.querySelector('.p-dataEmbarque').value,
        dataRetorno: card.querySelector('.p-dataRetorno').value,
        valor: card.querySelector('.p-valor').value,
        comissao: card.querySelector('.p-comissao').value,
        taxa: card.querySelector('.p-taxa').value,
        over: card.querySelector('.p-over').value,
        intermediario: card.querySelector('.p-intermediario').value,
        fornecedor: card.querySelector('.p-fornecedor').value,
        localizador: card.querySelector('.p-localizador').value
    }));
    
    // Validação de fornecedor
    const semFornecedor = produtos.filter(p => !p.fornecedor);
    if (semFornecedor.length > 0) {
        mostrarNotificacao('Todos os produtos devem ter um fornecedor selecionado', 'error');
        return;
    }
    
    const vendaAtualizada = {
        clienteIndex: parseInt(clienteIndex),
        produtos: produtos
    };
    
    const resultado = DB_VENDAS.atualizar(indice, vendaAtualizada);
    
    if (resultado.sucesso) {
        mostrarNotificacao(resultado.mensagem, 'success');
        cancelarEdicao();
        carregarTodasVendas();
    } else {
        mostrarNotificacao(resultado.mensagem, 'error');
    }
});

document.getElementById('btnCancelarEdicao').addEventListener('click', cancelarEdicao);

function cancelarEdicao() {
    elementos.formEdicao.classList.remove('ativo');
    elementos.formularioCadastro.style.display = 'block';
    elementos.editContainerProdutos.innerHTML = '';
    produtosEditLista = [];
}

function excluirVenda(indice) {
    const venda = DB_VENDAS.buscarPorIndice(indice);
    if (!venda) {
        mostrarNotificacao('Venda não encontrada', 'error');
        return;
    }
    if (confirm(`Deseja realmente excluir a venda #${venda.numero}?`)) {
        const resultado = DB_VENDAS.remover(indice);
        if (resultado.sucesso) {
            mostrarNotificacao(resultado.mensagem, 'success');
            carregarTodasVendas();
        } else {
            mostrarNotificacao(resultado.mensagem, 'error');
        }
    }
}

carregarTodasVendas();
console.log('Módulo de vendas carregado - VALIDAÇÃO OBRIGATÓRIA');
</script>
</body>
</html>
